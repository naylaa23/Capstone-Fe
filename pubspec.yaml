name: qalamku
description: Aplikasi pembelajaran Iqro dan penilaian otomatis menulis huruf hijaiyah untuk anak.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2          # state management
  shared_preferences: ^2.3.2 # penyimpanan lokal (akun & progres)
  crypto: ^3.0.3            # hash kata sandi (mode lokal)
  google_fonts: ^6.2.1      # Poppins (UI) & Amiri (huruf Arab)
  flutter_tts: ^4.0.2       # suara contoh huruf
  camera: ^0.11.0+2         # kamera kustom dengan kotak putus-putus
  image: ^4.2.0             # olah foto untuk penilaian tulisan

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
